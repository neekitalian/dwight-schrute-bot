services:
  shadow:
    build:
      context: ..
    image: dwight-shadow:local
    command: ["shadow", "--release", "/app/releases/candidate", "--state", "/app/runs/shadow"]
    env_file: ../.env
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777,size=64m"]
    volumes:
      - ../runs:/app/runs
      - ../releases/candidate:/app/releases/candidate:ro
    healthcheck:
      test: ["CMD", "dwight", "health", "--state", "/app/runs/shadow"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
