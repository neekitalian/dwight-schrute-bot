name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_demo.py
      - run: dwight replay examples/synthetic.csv --symbol SYNTHETIC
      - run: python examples/make_experiment_demo.py
      - run: dwight experiment private-data/synthetic-vwap-5Min.csv --symbol QQQ --synthetic --config configs/synthetic-experiment.json --output runs/experiment-smoke
