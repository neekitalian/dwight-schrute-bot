name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      MPLCONFIGDIR: /tmp/dwight-matplotlib
      XDG_CACHE_HOME: /tmp/dwight-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_demo.py
      - run: dwight replay examples/synthetic.csv --symbol SYNTHETIC
      - run: python examples/make_experiment_demo.py
      - run: dwight experiment private-data/synthetic-vwap-5Min.csv --symbol QQQ --synthetic --config configs/synthetic-experiment.json --output runs/experiment-smoke
