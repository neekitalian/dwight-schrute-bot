[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwight-schrute-bot"
version = "0.4.0"
description = "QQQ historical research and TradingView alert toolkit"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
data = ["exchange-calendars>=4.5,<5", "pyarrow>=16,<24", "certifi>=2024.2.2"]
research = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
tracking = ["mlflow-skinny>=3,<4", "sqlalchemy>=2,<3", "alembic>=1.13,<2"]
reporting = ["matplotlib>=3.8,<4"]
dashboard = ["plotly==6.3.1"]
rl-env = ["gymnasium==1.2.1", "numpy>=1.26,<3"]

[project.scripts]
dwight = "dwight.__main__:main"

[tool.setuptools.packages.find]
include = ["dwight*", "vwap_bot*"]
