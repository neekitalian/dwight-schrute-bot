[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwight-schrute-bot"
version = "0.1.0"
description = "Paper-first strategy research and connector framework"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
dwight = "dwight.__main__:main"

[tool.setuptools.packages.find]
include = ["dwight*", "vwap_bot*"]
